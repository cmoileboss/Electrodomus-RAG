services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile

    container_name: rag-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electrodomus

    ports:
      - "5433:5432"

    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electrodomus"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-api

    env_file: .env

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: electrodomus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/chat}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - .:/app
      - ./Documentation_Electrodomus:/app/Documentation_Electrodomus

    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
