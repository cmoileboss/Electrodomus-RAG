services:
  postgres:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-electrodomus}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    command: >
      postgres
        -c shared_preload_libraries=pg_textsearch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-electrodomus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    environment:
      DATABASE_NAME: ${DATABASE_NAME:-electrodomus}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_HOST: postgres
      DATABASE_PORT: ${DATABASE_PORT:-5432}
    volumes:
      - .:/app
      - ./Documentation_Electrodomus:/app/Documentation_Electrodomus
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
